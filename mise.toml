[tools]
node = "24.18.0"
pnpm = "11.17.0"
typst = "0.14.0"

[tasks.build-pdf]
depends = ["prebuild"]
run = "node scripts/src/build-pdf.ts"

[tasks.build-print]
depends = ["build-pdf"]
run = "node scripts/src/build-print.ts"

[tasks.prepare-web]
depends = ["build-print", "export-web"]
run = "node scripts/src/prepare-web.ts"

[tasks.build-web]
depends = ["prepare-web"]
dir = "web"
run = "node ../node_modules/vite/bin/vite.js build"

[tasks.check-web]
depends = ["prepare-web"]
run = "pnpm exec tsc --noEmit -p web/tsconfig.json"

[tasks.dev]
depends = ["prepare-web"]
dir = "web"
run = "node ../node_modules/vite/bin/vite.js --host 127.0.0.1"

[tasks.preview]
dir = "web"
run = "node ../node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173"

[tasks.check]
depends = ["format:check", "lint"]
run = "pnpm exec tsc --noEmit"

[tasks.format]
run = "pnpm exec oxfmt --write ."

[tasks."format:check"]
run = "pnpm exec oxfmt --check ."

[tasks.lint]
run = "pnpm exec oxlint --ignore-path .gitignore --deny-warnings ."

[tasks."lint:fix"]
run = "pnpm exec oxlint --ignore-path .gitignore --fix --deny-warnings ."

[tasks.download-icons]
run = "node scripts/src/download-icons.ts"

[tasks.export-web]
depends = ["prebuild"]
run = "node scripts/src/export-web.ts"

[tasks.fetch-github-metadata]
run = "node scripts/src/fetch-github-metadata.ts"

[tasks.fetch-solved-metadata]
run = "node scripts/src/fetch-solved-metadata.ts"

[tasks.generate-cover]
run = "node scripts/src/generate-cover.ts"

[tasks."hooks:install"]
run = "git config core.hooksPath scripts/git-hooks"

[tasks.prebuild]
run = "node scripts/src/prebuild.ts"

[tasks.reset]
run = "node scripts/src/reset.ts"
